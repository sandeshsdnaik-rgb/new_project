<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard | WHATIF</title>
    <link rel="stylesheet" href="/css/global.css" />
    <link rel="stylesheet" href="/css/dashboard.css" />
    <link rel="stylesheet" href="/css/responsive.css" />
  </head>
  <body>
    <div class="container site-shell">
      <header class="topbar">
        <div class="logo">WHATIF</div>
        <nav class="nav">
          <a href="/dashboard">Dashboard</a>
          <a href="/decision-studio">Decision Studio</a>
          <a href="/simulation-lab">Simulation Lab</a>
          <a href="/scenario-explorer">Scenarios</a>
          <a href="/reports">Reports</a>
          <a href="/settings">Settings</a>
        </nav>
      </header>

      <main class="dashboard-shell">
        <h2>Welcome back</h2>
        <div id="dashboard-summary" class="summary-grid"></div>

        <div class="content-grid">
          <section class="panel">
            <h3>Recent decisions</h3>
            <div id="recent-decisions" class="list"></div>
          </section>
          <aside class="panel">
            <h3>Recent activity</h3>
            <ul id="recent-activity" class="activity-list"></ul>
          </aside>
        </div>
      </main>
    </div>
    <script src="/js/config.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/dashboard.js"></script>
  </body>
</html>
