<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up | WHATIF</title>
    <link rel="stylesheet" href="/css/global.css" />
    <link rel="stylesheet" href="/css/auth.css" />
    <link rel="stylesheet" href="/css/responsive.css" />
  </head>
  <body>
    <div class="container auth-wrap">
      <div class="auth-card">
        <div class="logo">WHATIF</div>
        <h2>Create account</h2>
        <form id="signup-form" class="form-grid">
          <div class="field">
            <label for="full-name">Full name</label>
            <input id="full-name" type="text" placeholder="Your name" required />
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input id="email" type="email" placeholder="you@example.com" required />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input id="password" type="password" placeholder="••••••••" required />
          </div>
          <div class="form-actions">
            <button type="submit" class="btn primary">Sign up</button>
            <a class="subtle-link" href="/login">Already have an account?</a>
          </div>
          <div id="auth-status" class="hidden"></div>
        </form>
      </div>
    </div>
    <script src="/js/config.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
  </body>
</html>
